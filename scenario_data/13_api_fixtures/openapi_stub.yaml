openapi: 3.0.3
info:
  title: Corporate RM Continuous Engagement Demo API
  version: 1.1.0
  description: Synthetic V1.1 demo API for the 华东精工 continuous engagement scenario.
servers:
  - url: http://127.0.0.1:8088
paths:
  /api/v1/rm/day:
    get:
      summary: 获取客户经理今日经营队列
      responses:
        '200':
          description: OK
  /api/v1/customers/{customer_id}/operating-view:
    get:
      summary: 获取Customer Operating View
      parameters:
        - in: path
          name: customer_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
  /api/v1/customers/{customer_id}/kyc-gap:
    get:
      summary: 获取KYC Gap与问题计划
      parameters:
        - in: path
          name: customer_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
  /api/v1/visits/prep:
    post:
      summary: 生成访前Mission/R1/R2
      responses:
        '200':
          description: OK
  /api/v1/outreach/draft:
    post:
      summary: 生成客户触达草稿，不执行发送
      responses:
        '200':
          description: OK
  /api/v1/interactions/extract:
    post:
      summary: 从笔记/口述中抽取Interaction对象
      responses:
        '200':
          description: OK
  /api/v1/reconciliation:
    post:
      summary: 事实/语义对账
      responses:
        '200':
          description: OK
  /api/v1/commitments/exit-confirm:
    post:
      summary: 生成离场承诺确认
      responses:
        '200':
          description: OK
  /api/v1/reports/post-visit:
    post:
      summary: 生成R4/R5A/R5B
      responses:
        '200':
          description: OK
  /api/v1/writeback/commands:
    post:
      summary: 生成CRM写回命令，不直接写源系统
      responses:
        '200':
          description: OK
  /api/v1/human-gates/{gate_id}/decision:
    post:
      summary: 提交人工Accept/Edit/Reject
      parameters:
        - in: path
          name: gate_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
  /api/v1/evidence/ingest:
    post:
      summary: 接收新Evidence并触发R7/R8更新
      responses:
        '200':
          description: OK
  /api/v1/reports/r7-r8:
    get:
      summary: 获取R7/R8版本链
      responses:
        '200':
          description: OK
