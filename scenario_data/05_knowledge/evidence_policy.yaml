content_types:
  - FACT
  - CLAIM
  - INTENT
  - PREFERENCE
  - FINDING
  - SIGNAL
  - PENDING_CONFIRMATION
  - HUMAN_JUDGMENT
rules:
  -
    type: FACT
    require: bank_system_or_customer_document_or_confirmed_authoritative_source
  -
    type: CLAIM
    require: speaker + interaction + verbatim_ref
  -
    type: FINDING
    require: evidence_bundle + method + limitation
  -
    type: SIGNAL
    require: source + relevance + no_go
  -
    type: PENDING_CONFIRMATION
    require: open_question + owner
