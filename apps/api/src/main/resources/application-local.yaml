# Docker Compose local development profile
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/gits_kno?useSSL=false&allowPublicKeyRetrieval=true
    username: ${GITS_KEDB_USER:root}
    password: ${GITS_KEDB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true

gits:
  seed:
    enabled: true  # Enable seed data for local development

engagement:
  scenario:
    enabled: true
  llm:
    mode: mock
  crm:
    mode: logging
  security:
    api-key: ""  # No API key in local dev
    cors:
      allowed-origins: "http://localhost,http://localhost:80,http://nginx"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

server:
  shutdown: graceful
