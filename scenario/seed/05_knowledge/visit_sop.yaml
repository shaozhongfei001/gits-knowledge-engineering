follow_up_visit:
  before:
    - 回顾上次客户表达、未决事项和双方承诺
    - 明确本次1-2个主目标
    - 按对象准备问题
    - 准备产品/案例但不预设客户需求
  during:
    - 开场先重述上次已知问题并确认理解
    - 问题由宽到窄
    - 新信息改变判断时动态追问
    - 离场前复述已确认事项和双方下一步
  after:
    - 对照访前目标与问题覆盖情况
    - 保留客户原话和人工判断分层
    - 生成Call Report/任务/协同动作
    - 下一次拜访继承未决问题
reference_note: 吸收行业岗位作业参考中的访前准备、后续拜访、离场确认与Call Report方法；不视为杭州银行现行制度。
