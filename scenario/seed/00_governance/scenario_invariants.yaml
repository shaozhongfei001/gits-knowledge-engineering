invariants:
  - 每个P0痛点必须绑定至少1个事件、1组数据、1段对话、1个页面状态、1次Skill/Policy调用、1个Human Gate、1个验收用例。
  - 所有关键业务结论必须有source_ref/evidence_ref/as_of。
  - 所有涉及客户表达的对象必须保存speaker、interaction_id和原文引用。
  - 所有高风险写回必须存在before/proposed/risk_level/human_decision/audit_ref/idempotency_key。
  - 所有Product Knowledge必须有version/effective_from/effective_to/status/owner。
  - 所有Runtime Skill调用必须有input_refs/output_ref/policy_checks/human_gate/latency/status。
  - 数据不足时必须返回degraded/unknown/pending，不得凭模型补造事实。
