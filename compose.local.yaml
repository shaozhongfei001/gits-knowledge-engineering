services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${GITS_KEDB_NAME:-gits_ke}
      SPRING_DATASOURCE_USERNAME: ${GITS_KEDB_USER:-ontos}
      SPRING_DATASOURCE_PASSWORD: ${GITS_KEDB_PASSWORD:?set GITS_KEDB_PASSWORD outside the repository}
      SPRING_PROFILES_ACTIVE: local
    profiles: [local-db]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    depends_on:
      api:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${GITS_KEDB_NAME:-gits_ke}
      SPRING_DATASOURCE_USERNAME: ${GITS_KEDB_USER:-ontos}
      SPRING_DATASOURCE_PASSWORD: ${GITS_KEDB_PASSWORD:?set GITS_KEDB_PASSWORD outside the repository}
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8090"
    profiles: [local-db]

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    profiles: [local-db]

  mysql:
    image: mysql:8.4
    profiles: [local-db]
    environment:
      MYSQL_DATABASE: ${GITS_KEDB_NAME:-gits_ke}
      MYSQL_USER: ${GITS_KEDB_USER:-ontos}
      MYSQL_PASSWORD: ${GITS_KEDB_PASSWORD:?set GITS_KEDB_PASSWORD outside the repository}
      MYSQL_ROOT_PASSWORD: ${GITS_KEDB_ROOT_PASSWORD:?set GITS_KEDB_ROOT_PASSWORD outside the repository}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - gits_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  gits_mysql_data:
