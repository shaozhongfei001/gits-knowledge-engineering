services:
  mysql:
    image: mysql:8.4
    profiles: [local-db]
    environment:
      MYSQL_DATABASE: ${HZB_DB_NAME:-hzb_kno}
      MYSQL_USER: ${HZB_DB_USER:-hzb_kno}
      MYSQL_PASSWORD: ${HZB_DB_PASSWORD:?set HZB_DB_PASSWORD outside the repository}
      MYSQL_ROOT_PASSWORD: ${HZB_DB_ROOT_PASSWORD:?set HZB_DB_ROOT_PASSWORD outside the repository}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - hzb_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  hzb_mysql_data:
