# 生产环境Docker Compose配置
# 使用方法:
#   1. 复制 .env.prod.template 为 .env.prod 并填写真实配置
#   2. docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d
#
# ⚠️ 所有敏感配置通过环境变量注入，不硬编码密钥
# ⚠️ 生产环境必须配置API_KEY和CORS_ALLOWED_ORIGINS

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"  # 仅绑定本地，由Nginx反代
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # MySQL数据源
      MYSQL_URL: ${MYSQL_URL:?MYSQL_URL is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      # Oracle数据源(可选)
      ORACLE_SOURCE_ENABLED: ${ORACLE_SOURCE_ENABLED:-false}
      ORACLE_JDBC_URL: ${ORACLE_JDBC_URL:-}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      # LLM配置
      LLM_MODE: ${LLM_MODE:-real}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required when LLM_MODE=real}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      # CRM配置
      CRM_MODE: ${CRM_MODE:-http}
      CRM_BASE_URL: ${CRM_BASE_URL:-}
      CRM_AUTH_TOKEN: ${CRM_AUTH_TOKEN:-}
      # 安全配置
      API_KEY: ${API_KEY:?API_KEY is required in production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in production}
      # 可观测性
      ZIPKIN_URL: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      TRACE_SAMPLING: ${TRACE_SAMPLING:-0.1}
      # 日志
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WORKER_PORT:-8090}:8090"
    depends_on:
      api:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: ${MYSQL_URL:?MYSQL_URL is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SERVER_PORT: "8090"
      ZIPKIN_URL: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      TRACE_SAMPLING: ${TRACE_SAMPLING:-0.1}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gits_kno}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - gits_prod_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 15s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "10"

  # 可观测性
  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "127.0.0.1:${ZIPKIN_PORT:-9411}:9411"
    environment:
      STORAGE_TYPE: ${ZIPKIN_STORAGE_TYPE:-mem}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9411/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - gits_prod_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required in production}
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - gits_prod_grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    restart: unless-stopped

volumes:
  gits_prod_mysql_data:
  gits_prod_prometheus_data:
  gits_prod_grafana_data:
