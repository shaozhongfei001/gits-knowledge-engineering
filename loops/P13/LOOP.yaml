    title: Worker激活
    priority: P0
    status: DONE
    description: |
      激活Worker模块，建立事件消费者框架:
      1. Worker pom.xml添加spring-boot-starter-web依赖
      2. Worker application.yaml: gits.worker.enabled=true
      3. 创建ClaimCandidateRecordedHandler: 处理claimCandidateRecorded事件
         - 记录Claim到持久化存储(调用WritableClaimRepository)
         - 触发KYC洞察更新
      4. 创建ControlledActionRequestedHandler: 处理controlledActionRequested事件
         - 记录ControlledAction到持久化存储
         - 触发CRM回写(调用CrmWritebackService)
      5. 事件传输机制: 当前使用Spring ApplicationEventPublisher(进程内)
         - 创建EventBridge接口抽象传输层
         - InMemoryEventBridge实现(当前默认)
         - 为未来Kafka/RabbitMQ预留扩展点
      6. WorkerEventHandler增强: 添加事件处理回调机制
      7. Worker集成测试

  - id: G3
    title: 真实LLM对接
    priority: P1
    status: DONE
    description: |
      实现RealLlmClient，对接OpenAI兼容API:
      1. apps/api/pom.xml添加spring-ai-openai-spring-boot-starter或直接使用RestClient
      2. 实现RealLlmClient: 调用OpenAI Chat Completions API
         - 配置: engagement.llm.api-key, engagement.llm.base-url, engagement.llm.model
         - 支持通义千问(base-url切换)等OpenAI兼容API
         - 超时配置: engagement.llm.timeout
         - 重试: 最多1次重试
         - 错误处理: 映射HTTP错误到LlmClientException
      3. EngagementConfig更新: mode=real时创建RealLlmClient(注入配置)
      4. application.yaml添加LLM配置段
      5. LLM健康检查: LlmHealthIndicator检查连接性
      6. RealLlmClientTest: 使用WireMock模拟OpenAI API

  - id: G4
    title: 真实CRM对接
    priority: P1
    status: DONE
    description: |
      完善HttpCrmWritebackChannel，配置化启用:
      1. HttpCrmWritebackChannel增强:
         - 添加认证支持: Bearer Token或API Key
         - 添加超时配置: engagement.crm.timeout
         - 添加重试: 最多1次重试
         - 添加错误映射: HTTP错误→WritebackResult.failed()
         - 添加请求/响应日志(MDC)
      2. 配置完善: engagement.crm.auth-token, engagement.crm.timeout
      3. CRM健康检查: CrmHealthIndicator检查连接性
      4. HttpCrmWritebackChannelTest: 使用WireMock模拟CRM API
      5. application.yaml添加CRM配置段

  - id: G5
    title: 链路追踪
    priority: P2
    status: DONE
    description: |
      建立分布式链路追踪基础:
      1. 添加micrometer-tracing-bridge-brave依赖
      2. 添加io.zipkin.reporter2:zipkin-reporter-brave依赖
      3. 配置Spring Boot 3 Observation API
      4. 自动注入traceId/spanId到MDC
      5. 配置采样率: management.tracing.sampling.probability
      6. application.yaml添加tracing配置
      7. Zipkin导出配置(可选,默认关闭)
      8. 验证traceId出现在结构化日志中

  - id: G6
    title: Oracle只读管道
    priority: P1
    status: DONE
    description: |
      建立Oracle只读数据管道:
      1. 创建modules/oracle-source模块(或adapters/oracle-source)
      2. Oracle JDBC依赖(ojdbc11, scope=provided或optional)
      3. OracleSourcePort接口: List<OracleClaim> readClaims(LocalDateTime since)
      4. JdbcOracleSourceAdapter: 使用JdbcTemplate批量读取
         - 配置: oracle.source.jdbc-url, oracle.source.username, oracle.source.password
         - SQL: SELECT * FROM claim WHERE last_updated > ? ORDER BY last_updated
         - 行映射: OracleClaim record
      5. OracleClaim到领域Claim的映射器
      6. OracleSourceHealthIndicator
      7. Oracle集成测试(使用H2模拟Oracle,或@ConditionalOnProperty跳过)
      8. application-oracle.yaml配置模板

