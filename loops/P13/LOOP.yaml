    title: 可观测性三件套
    priority: P0
    status: DONE
    description: |
      建立Micrometer指标采集 + 结构化日志 + Actuator增强:
      1. Micrometer依赖引入 + Prometheus endpoint暴露
      2. 自定义业务指标: engagement_journey_started_total, engagement_journey_completed_total,
         dmn_decision_total{status=}, llm_call_total{mode=,result=}, crm_writeback_total{mode=,result=},
